<!-- game/templates/game/map.html -->
{% extends "game/base.html" %}
{% load static %}

{% block content %}
<div class="game-container">
    <div class="sidebar">
        <h2>Страны Европы</h2>
        <div id="country-list">
            {% for country in countries %}
            <div class="country-item" data-country="{{ country.code }}">
                <span class="color-dot" style="background-color: {{ country.color }}"></span>
                {{ country.name }}
                <span class="resources">💰 {{ country.gold }}</span>
            </div>
            {% endfor %}
        </div>
        
        <div class="turn-info">
            Ход: <span id="turn-counter">{{ game.turn }}</span>
            <button id="end-turn" class="btn">Завершить ход</button>
        </div>
    </div>
    
    <div class="map-container">
        <svg id="europe-map" viewBox="0 0 1000 800">
            <!-- Здесь будет карта Европы -->
            {% for region in regions %}
            <path class="region" 
                  data-region="{{ region.id }}"
                  data-owner="{{ region.owner.code|default:'neutral' }}"
                  d="{{ region.svg_path }}"
                  fill="{% if region.owner %}{{ region.owner.color }}{% else %}#cccccc{% endif %}"
                  stroke="#000"
                  stroke-width="1"/>
            {% endfor %}
        </svg>
    </div>
    
    <div class="info-panel" id="region-info">
        <h3>Выберите регион</h3>
        <!-- Информация будет подгружаться через JavaScript -->
    </div>
</div>

<script src="{% static 'js/map.js' %}"></script>
{% endblock %}
