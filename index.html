<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Европа: Битва за континент</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cinzel', 'Georgia', serif;
        }

        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #1a1f2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');

        .game-wrapper {
            width: 1600px;
            max-width: 100%;
            background: rgba(10, 15, 30, 0.9);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 0 2px #2a3045 inset;
            backdrop-filter: blur(10px);
        }

        /* Шапка с ресурсами */
        .header {
            background: linear-gradient(180deg, #232845 0%, #14182f 100%);
            border-radius: 20px;
            padding: 15px 30px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #3f4a7a;
            box-shadow: 0 5px 0 #0a0d1a;
            position: relative;
        }

        .header::before {
            content: "⚔️ IMPERIUM EUROPA ⚔️";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #e94560;
            color: white;
            padding: 5px 30px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 3px;
            box-shadow: 0 3px 0 #8a1f2f;
            text-shadow: 0 1px 2px black;
        }

        .resources {
            display: flex;
            gap: 20px;
        }

        .resource {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0b0f21;
            padding: 12px 25px;
            border-radius: 15px;
            border: 1px solid #4f5a8f;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 3px 0 #1f2440;
            transition: all 0.2s;
        }

        .resource:hover {
            transform: translateY(-2px);
            border-color: #e94560;
            box-shadow: 0 5px 0 #1f2440;
        }

        .resource-icon {
            font-size: 1.8em;
        }

        .resource-info {
            display: flex;
            flex-direction: column;
        }

        .resource-label {
            font-size: 0.8em;
            color: #aab3d9;
            text-transform: uppercase;
        }

        .resource-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 3px black;
            line-height: 1;
        }

        .turn-box {
            background: #0b0f21;
            padding: 10px 25px;
            border-radius: 15px;
            border: 1px solid #4f5a8f;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .turn-number {
            font-size: 2em;
            font-weight: bold;
            color: #e94560;
            text-shadow: 0 2px 0 #8a1f2f;
        }

        .btn {
            background: linear-gradient(180deg, #e94560 0%, #b32b41 100%);
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 3px solid #6e1a2a;
            transition: all 0.1s;
            font-family: 'Cinzel', serif;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(2px);
            border-bottom-width: 1px;
        }

        .btn-secondary {
            background: linear-gradient(180deg, #3f4a7a 0%, #262e50 100%);
            border-bottom-color: #12172f;
        }

        /* Основная область */
        .main-area {
            display: flex;
            gap: 20px;
            min-height: 600px;
        }

        /* Боковая панель */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1b203a 0%, #12172c 100%);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid #3f4a7a;
            box-shadow: 0 5px 0 #0a0d1a;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar h2 {
            color: #e94560;
            font-size: 1.3em;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #3f4a7a;
            letter-spacing: 2px;
        }

        .countries-list {
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-right: 5px;
        }

        .countries-list::-webkit-scrollbar {
            width: 6px;
        }

        .countries-list::-webkit-scrollbar-track {
            background: #1f2440;
            border-radius: 10px;
        }

        .countries-list::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 10px;
        }

        .country-item {
            background: #262e50;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid transparent;
            border-bottom: 2px solid #12172f;
        }

        .country-item:hover {
            background: #2f3860;
            transform: translateX(3px);
        }

        .country-item.selected {
            border-left-color: #e94560;
            background: #2f3860;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
        }

        .country-flag {
            width: 24px;
            height: 16px;
            background: #fff;
            border-radius: 3px;
            box-shadow: 0 2px 3px black;
        }

        .country-name {
            flex: 1;
            font-size: 0.9em;
            font-weight: bold;
        }

        .country-stats {
            font-size: 0.8em;
            background: #1a1f3a;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .info-panel {
            background: #1a1f3a;
            border-radius: 15px;
            padding: 15px;
            border: 1px solid #3f4a7a;
            margin-top: auto;
        }

        .info-panel h3 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            color: #aab3d9;
        }

        .info-value {
            color: white;
            font-weight: bold;
        }

        /* Карта */
        .map-container {
            flex: 1;
            background: #0a1a2f;
            border-radius: 20px;
            padding: 20px;
            border: 2px solid #3f4a7a;
            box-shadow: 0 5px 0 #0a0d1a;
            position: relative;
            overflow: hidden;
        }

        .map-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(10, 30, 50, 0.3), rgba(0, 5, 15, 0.7));
            pointer-events: none;
            z-index: 1;
        }

        #europeMap {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.5));
            position: relative;
            z-index: 2;
        }

        .region {
            transition: all 0.3s;
            cursor: pointer;
            stroke: #2a3045;
            stroke-width: 1.5;
        }

        .region:hover {
            filter: brightness(1.3);
            stroke: #e94560;
            stroke-width: 2;
            filter: drop-shadow(0 0 8px rgba(233, 69, 96, 0.5));
        }

        .region.selected {
            stroke: #e94560;
            stroke-width: 3;
            filter: drop-shadow(0 0 12px #e94560);
        }

        /* Панель действий */
        .action-panel {
            width: 280px;
            background: linear-gradient(180deg, #1b203a 0%, #12172c 100%);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid #3f4a7a;
            box-shadow: 0 5px 0 #0a0d1a;
        }

        .action-panel h3 {
            color: #e94560;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.3em;
            border-bottom: 2px solid #3f4a7a;
            padding-bottom: 10px;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #2f3860 0%, #1f2645 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1em;
            border-bottom: 3px solid #12172f;
            font-family: 'Cinzel', serif;
        }

        .action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background: linear-gradient(180deg, #3f4a7a 0%, #2f3860 100%);
            border-bottom-color: #1f2645;
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .action-btn.attack {
            background: linear-gradient(180deg, #b32b41 0%, #8a1f2f 100%);
            border-bottom-color: #4a121f;
        }

        .cost-badge {
            margin-left: auto;
            background: #0b0f21;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9em;
            border: 1px solid #4f5a8f;
        }

        .warning {
            color: #e94560;
            font-size: 0.9em;
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            background: rgba(233, 69, 96, 0.1);
            border-radius: 8px;
            border: 1px solid #e94560;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(180deg, #1b203a 0%, #12172c 100%);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #e94560;
            max-width: 400px;
            width: 90%;
            text-align: center;
            color: white;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Cinzel', serif;
        }

        .modal-btn.yes {
            background: #e94560;
            color: white;
        }

        .modal-btn.no {
            background: #3f4a7a;
            color: white;
        }

        /* Анимации */
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1b203a;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            border-left: 5px solid #e94560;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: slideIn 0.3s;
            z-index: 2000;
            font-weight: bold;
        }

        .toast.success {
            border-left-color: #00c851;
        }

        .toast.error {
            border-left-color: #e94560;
        }
    </style>
</head>
<body>

        // Данные о странах из твоего JSON
