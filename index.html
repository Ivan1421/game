<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #1a1a2e; }
        .game-container { display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #16213e; color: white; padding: 20px; }
        .map-container { flex: 1; padding: 20px; }
        #europeMap { width: 100%; height: 100%; background: #0a1a2f; }
        .region { cursor: pointer; transition: all 0.3s; }
        .region:hover { filter: brightness(1.3); stroke: #e94560; stroke-width: 2; }
        .info-panel { margin-top: 20px; padding: 15px; background: #1f2a48; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="sidebar">
            <h2>Европейская стратегия</h2>
            <div class="info-panel" id="info">
                <p>Выберите страну на карте</p>
            </div>
        </div>
        
        <div class="map-container">
            <object id="europeMap" type="image/svg+xml" data="map.svg" width="100%" height="100%"></object>
        </div>
    </div>

    <script>
        document.getElementById('europeMap').addEventListener('load', function() {
            const svgDoc = this.contentDocument;
            const paths = svgDoc.querySelectorAll('path');
            
            paths.forEach(path => {
                path.classList.add('region');
                path.addEventListener('click', function() {
                    const countryId = this.id || 'unknown';
                    document.getElementById('info').innerHTML = `
                        <h3>Выбрана страна</h3>
                        <p>ID: ${countryId}</p>
                        <p>Название: ${this.getAttribute('title') || 'Неизвестно'}</p>
                    `;
                });
            });
        });
    </script>
</body>
</html>
